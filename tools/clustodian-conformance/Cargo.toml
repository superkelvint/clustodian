[package]
name = "clustodian-conformance"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "clustodian-conformance"
description = "JSON conformance boundary for clustodian"
license = "Apache-2.0"

[dependencies]
clustodian = { path = "../.." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "time"] }
