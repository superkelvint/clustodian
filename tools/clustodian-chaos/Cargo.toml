[package]
name = "clustodian-chaos"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "clustodian-chaos"

[dependencies]
clustodian = { path = "../..", features = ["m13-failpoints"] }
fail = { version = "0.5.1", features = ["failpoints"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["fs", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
