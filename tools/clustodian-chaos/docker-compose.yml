services:
  etcd1:
    image: quay.io/coreos/etcd:v3.7.1
    command:
      - /usr/local/bin/etcd
      - --name=etcd1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=clustodian-m13
      - --max-request-bytes=67108864
      - --log-level=warn
    ports:
      - "23791:2379"
    volumes:
      - etcd1:/etcd-data
  etcd2:
    image: quay.io/coreos/etcd:v3.7.1
    command:
      - /usr/local/bin/etcd
      - --name=etcd2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=clustodian-m13
      - --max-request-bytes=67108864
      - --log-level=warn
    ports:
      - "23792:2379"
    volumes:
      - etcd2:/etcd-data
  etcd3:
    image: quay.io/coreos/etcd:v3.7.1
    command:
      - /usr/local/bin/etcd
      - --name=etcd3
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd3:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=clustodian-m13
      - --max-request-bytes=67108864
      - --log-level=warn
    ports:
      - "23793:2379"
    volumes:
      - etcd3:/etcd-data
  toxiproxy:
    image: shopify/toxiproxy:2.5.0
    command: -host=0.0.0.0
    depends_on:
      - etcd1
      - etcd2
      - etcd3
    ports:
      - "8474:8474"
      - "12379-12396:12379-12396"
      - "13379-14128:13379-14128"

volumes:
  etcd1:
  etcd2:
  etcd3:
