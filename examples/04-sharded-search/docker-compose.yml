services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    command:
      - /usr/local/bin/etcd
      - --name=search-etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://127.0.0.1:2380
      - --initial-cluster=search-etcd=http://127.0.0.1:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=clustodian-sharded-search
      - --log-level=error
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - search-etcd-data:/etcd-data

volumes:
  search-etcd-data:
