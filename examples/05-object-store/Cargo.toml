[package]
name = "clustodian-object-store"
version = "0.1.0"
edition = "2021"
publish = false

[features]
shuttle = []

[[bin]]
name = "object-store"
path = "src/main.rs"

[dependencies]
clustodian = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
clustodian-test-support = { path = "../../tools/clustodian-test-support" }
tempfile = "3.27.0"
