[package]
name = "clustodian-game-servers"
version = "0.1.0"
edition = "2021"
publish = false

[features]
shuttle = []

[dependencies]
clustodian = { path = "../../" }
serde_json = "1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }

[dev-dependencies]
clustodian-test-support = { path = "../../tools/clustodian-test-support" }
etcd-client = "0.15.0"
tempfile = "3.27.0"
