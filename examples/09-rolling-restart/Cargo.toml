[package]
name = "clustodian-rolling-restart"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rolling restart and session fencing showcase for Clustodian"

[features]
shuttle = []

[[bin]]
name = "rolling-restart"
path = "src/main.rs"

[dependencies]
clustodian = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["macros", "process", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
clustodian-test-support = { path = "../../tools/clustodian-test-support" }
etcd-client = "0.15.0"
tempfile = "3.27.0"
