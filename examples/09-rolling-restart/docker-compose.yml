services:
  etcd:
    image: quay.io/coreos/etcd:v3.7.1
    command:
      - /usr/local/bin/etcd
      - --name=rolling-restart
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=rolling-restart=http://etcd:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=clustodian-rolling-restart
      - --log-level=warn
    ports:
      - "23797:2379"
    volumes:
      - rolling-restart-etcd:/etcd-data

volumes:
  rolling-restart-etcd:
